name: Spec Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: spec-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Check upstream OpenAPI specs
        id: watch
        run: |
          set +e
          bun run spec:watch
          code=$?
          set -e
          if [ "$code" = "2" ]; then exit 2; fi
          echo "drift=$([ "$code" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          breaking=$(jq -r '[.changed[] | select(.breaksAutomaticRefresh == true) | .name] | join(", ")' artifacts/spec-watch/report.json)
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"

      - name: Regenerate bindings and refresh spec lock
        if: steps.watch.outputs.drift == 'true'
        run: |
          bun run check:generated
          bun run spec:lock

      - name: Typecheck and bundle regenerated bindings
        if: steps.watch.outputs.drift == 'true'
        run: |
          bun run typecheck
          bun run dry-run
          bun test tools/codegen

      - name: Open or update refresh pull request
        if: steps.watch.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/spec-refresh
          delete-branch: true
          commit-message: Refresh bindings from upstream OpenAPI specs
          title: ${{ steps.watch.outputs.breaking != '' && format('Refresh upstream specs (breaking: {0})', steps.watch.outputs.breaking) || 'Refresh upstream specs' }}
          body-path: artifacts/spec-watch/report.md
          add-paths: |
            capabilities/**

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capa-spec-watch
          path: artifacts/spec-watch/
