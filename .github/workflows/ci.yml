name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Regenerate checked-in capabilities
        run: bun run check:generated

  typecheck:
    runs-on: ubuntu-latest
    needs: generated
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck every capability and harness
        run: bun run typecheck

  dry-run:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Bundle every capability and harness
        run: bun run dry-run
